[package]
name = "slopcop"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Slop stops here. A deterministic linter for code and prose quality."
license = "MIT"
repository = "https://github.com/JGalego/slopcop"
keywords = ["linter", "cli", "code-quality", "documentation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "action.yml", "benchmarks/", "editors/", "install/", "web/"]

[dependencies]
aho-corasick = "1.1.5"
clap = { version = "4.5.48", features = ["derive"] }
ignore = "=0.4.23"
lsp-server = { version = "0.10.0", optional = true }
percent-encoding = "2.3.2"
rayon = "1.11.0"
regex = "1.11.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.7"

[features]
default = ["lsp"]
lsp = ["dep:lsp-server"]

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
