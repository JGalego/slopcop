name: Bug report
description: Report a crash, incorrect behavior, or unexpected output
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a concrete problem. Remove secrets and private source before submitting.

  - type: input
    id: version
    attributes:
      label: slopcop version
      description: Paste the output of `slopcop --version`.
      placeholder: slopcop 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and installation method.
      placeholder: Ubuntu 24.04, x86_64, cargo install
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest source or repository layout and exact command that reproduces the problem.
      placeholder: |
        File: example.py
        Command: slopcop example.py --format json
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and relevant output or error message.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should happen instead.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, credentials, and private source from this report.
          required: true