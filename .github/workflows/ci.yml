name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  msrv:
    name: Minimum Rust (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  quality:
    name: Quality and self-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -W clippy::all -W clippy::pedantic -D warnings
      - run: cargo package --locked
      - name: Lint slopcop with slopcop
        run: cargo run --release --locked -- .
      - name: Verify pre-commit integration
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files
          message_file="$(mktemp)"
          printf 'Describe Papertrail behavior\n' > "$message_file"
          pre-commit run slopcop-commit-msg --hook-stage commit-msg --commit-msg-filename "$message_file"
          rm -f "$message_file"
      - name: Benchmark smoke test
        run: cargo run --release --locked -- benchmark | tee benchmark-output.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-output
          path: benchmark-output.txt
