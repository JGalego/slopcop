name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  msrv:
    name: Minimum Rust (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  quality:
    name: Quality and self-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -W clippy::all -W clippy::pedantic -D warnings
      - name: Build without the language server
        run: cargo clippy --all-targets --no-default-features --locked -- -W clippy::all -W clippy::pedantic -D warnings
      - run: cargo package --locked
      - run: cargo build --release --locked
      - name: Lint slopcop with slopcop
        uses: ./
        with:
          binary: target/release/slopcop
          mode: all
      - name: Verify pre-commit integration
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files
          message_file="$(mktemp)"
          printf 'Describe Papertrail behavior\n' > "$message_file"
          pre-commit run slopcop-commit-msg --hook-stage commit-msg --commit-msg-filename "$message_file"
          rm -f "$message_file"
      - name: Benchmark smoke test
        run: cargo run --release --locked -- benchmark | tee benchmark-output.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-output
          path: benchmark-output.txt

  action:
    name: Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The fixtures are ignored by the project configuration, so scan them with an empty one.
      - name: Write an empty configuration
        shell: bash
        run: printf '[slopcop]\n' > "$RUNNER_TEMP/slopcop.toml"
      # The clean fixtures gain cases as unreleased fixes land, so the pinned release could report
      # them. A small project written here stays clean for any release.
      - name: Write a clean project
        shell: bash
        run: |
          mkdir -p action-clean
          printf 'def total(values):\n    return sum(values)\n' > action-clean/totals.py
          printf '# Totals\n\nThe script prints the sum of the numbers in each input file.\n' > action-clean/README.md
      - name: Scan the clean project with a released binary
        id: clean
        uses: ./
        with:
          version: v0.3.0
          paths: action-clean
          mode: all
          config: ${{ runner.temp }}/slopcop.toml
      - name: Scan the slop fixtures
        id: slop
        continue-on-error: true
        uses: ./
        with:
          version: v0.3.0
          paths: tests/fixtures/slop
          mode: all
          config: ${{ runner.temp }}/slopcop.toml
      - name: Report the slop fixtures without failing
        id: report
        uses: ./
        with:
          version: v0.3.0
          paths: tests/fixtures/slop
          mode: all
          config: ${{ runner.temp }}/slopcop.toml
          fail-on-findings: false
      - name: Check the action outputs
        shell: bash
        env:
          CLEAN_FINDINGS: ${{ steps.clean.outputs.findings }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit-code }}
          SLOP_OUTCOME: ${{ steps.slop.outcome }}
          REPORT_FINDINGS: ${{ steps.report.outputs.findings }}
          REPORT_EXIT: ${{ steps.report.outputs.exit-code }}
        run: |
          test "$CLEAN_FINDINGS" = 0
          test "$CLEAN_EXIT" = 0
          test "$SLOP_OUTCOME" = failure
          test "$REPORT_EXIT" = 1
          test "$REPORT_FINDINGS" -gt 0
      - name: Scan changed lines from a shallow checkout
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: ./
        with:
          version: v0.3.0
          paths: action-clean
          config: ${{ runner.temp }}/slopcop.toml

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Compile and package
        run: npx vsce package --out slopcop.vsix
