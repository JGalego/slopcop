name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Match tag to package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -W clippy::all -W clippy::pedantic -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo package --locked
      - run: cargo run --release --locked -- .

  msrv:
    name: Minimum Rust (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  github-release:
    name: Create GitHub release
    needs: [verify, msrv]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "slopcop ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

  publish:
    name: Publish to crates.io
    needs: [verify, msrv, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: [verify, msrv, github-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: slopcop
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  vscode:
    name: VS Code extension (${{ matrix.vscode }})
    needs: [binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode: linux-x64
            target: x86_64-unknown-linux-gnu
          - vscode: linux-arm64
            target: aarch64-unknown-linux-gnu
          - vscode: darwin-x64
            target: x86_64-apple-darwin
          - vscode: darwin-arm64
            target: aarch64-apple-darwin
          - vscode: win32-x64
            target: x86_64-pc-windows-msvc
          # Other platforms get the extension without a binary and use slopcop from PATH.
          - vscode: universal
            target: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Bundle the release binary
        if: matrix.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          stem="slopcop-${GITHUB_REF_NAME}-${TARGET}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "${stem}.*" --dir dist
          archive="$(ls dist/"${stem}".tar.gz dist/"${stem}".zip 2>/dev/null)"
          test "$(cut -d' ' -f1 "dist/${stem}.sha256")" = "$(sha256sum "$archive" | cut -d' ' -f1)"
          mkdir -p editors/vscode/bin
          case "$archive" in
            *.zip) unzip -j "$archive" slopcop.exe -d editors/vscode/bin ;;
            *) tar -xzf "$archive" -C editors/vscode/bin slopcop ;;
          esac
      - name: Package the extension
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.vscode }}
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          vsix="slopcop-${GITHUB_REF_NAME}-${PLATFORM}.vsix"
          if [ "$PLATFORM" = universal ]; then
            npx vsce package --out "$vsix"
          else
            npx vsce package --target "$PLATFORM" --out "$vsix"
          fi
          gh release upload "${GITHUB_REF_NAME}" "$vsix" --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        env:
          PLATFORM: ${{ matrix.vscode }}
        run: npx vsce publish --packagePath "slopcop-${GITHUB_REF_NAME}-${PLATFORM}.vsix"
