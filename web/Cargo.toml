[package]
name = "slopcop-web"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
description = "WebAssembly bindings that power the slopcop browser demo."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
serde_json = "1.0.145"
slopcop = { path = "..", default-features = false, features = ["polygraph-lm"] }
wasm-bindgen = "0.2.104"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-simd"]
