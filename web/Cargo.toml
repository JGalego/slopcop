[package]
name = "slopcop-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings that power the slopcop browser demo."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.145"
slopcop = { path = "..", default-features = false }
wasm-bindgen = "0.2.104"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types"]
